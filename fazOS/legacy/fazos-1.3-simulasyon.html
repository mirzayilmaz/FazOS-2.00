"README.txt":`FazOS 1.0 - FEAS Software
=========================
Hos geldin, gece gorevlisi.
Bu sistem bir hayran yapimi (fan-made) simulasyondur.

Masaustundeki simgelere cift tikla:
 - NOTLAR  : .txt dosyalarini oku
 - TERMINAL: 'help' yaz

 - SAAT    : Vardiya saati

"BITE_OF_87.txt":`ISIRIK OLAYI - 1987 (Bite of '87)
=================================
Durum   : Kapatildi / Halk bilgisi
Mekan   : Freddy Fazbear's Pizza (ikinci sube donemi)

OZET
Telefon Adami'nin (Phone Guy) anlattigi olaylardan biri.
Bir animatronik, bir kisinin on lobunu (frontal lobe)
isirarak kopardi. Kurban hayatta kaldi.

RESMI SOYLENEN
Animatronikler gece moduna gecince "serbest dolasim"
yaptigi icin bu tur olaylarin olabilecegi soylenir.
Sirket, olayin "normal bir kaza" olmadigini kabul etmez
ama sorumlulugu da ustlenmez.

TEORI (hayran yorumu)
- En yaygin teori: olayin sorumlusu Mangle'dir.
- Baska teori: olay "'83" isirigiyla karistirilir.
- Kurbanin kimligi kesin degildir; tartismalidir.

ETKI
- Pizzaci kapandi, imaj zedelendi.
- Animatroniklere ses/yuz tanima ozellikleri sonradan
  kisitlandi, "yetiskin yuzu" algisi kaldirildi iddiasi.

DOSYA NOTU: Detaylar hayran toplulugunun yorumudur.`,
"BITE_OF_83.txt":`ISIRIK OLAYI - 1983 (Bite of '83)
=================================
Genelde "Aglayan Cocuk" (Crying Child) hikayesiyle
anilir. Dogum gunu partisinde yasanan bir olay oldugu
ve cocugun agir yaralandigi teorisi yaygindir.
'83 ve '87 sik sik birbirine karistirilir.
Durum: Teori / Tartismali`,
"ANIMATRONICS.txt":`ANIMATRONIK LISTESI
===================
01 FREDDY   - Ana grup lideri, sahne sef ayi.
02 BONNIE   - Gitarist, tavsan.
03 CHICA    - Vokal, tavuk (kek tasir).
04 FOXY     - Pirate Cove'da, hizli kosar.
05 MANGLE   - Parcalanip tekrar birlestirilen "oyuncak".
06 BALLOON BOY - Balonlu kucuk figur.

Kural: Gece saat 00:00-06:00 arasi animatronikler
sabit durmayabilir. Kapilari ve isiklari kontrol et.`,

[00:00] Sistem baslatildi.

[03:30] Muzik kutusu cevrilmedi, uyari.
[05:58] Sabah vardiyasina hazir ol.
[06:00] Vardiya bitti. Iyi isler.`,
